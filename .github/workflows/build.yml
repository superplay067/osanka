name: Build Osanka APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libsqlite3-dev libffi-dev uuid-dev imagemagick

      - name: Install pip, setuptools and buildozer
        run: |
          python -m pip install --upgrade pip setuptools virtualenv
          pip install "cython<3.0.0" buildozer

      - name: Check and auto-create icon if missing
        run: |
          if [ ! -f "icon.png" ]; then
            echo "⚠️ Иконка icon.png не найдена! Создаем временную коралловую заглушку..."
            convert -size 512x512 xc:#F28073 icon.png
          fi

      - name: Force Fix Android Environment and SDK Paths
        run: |
          # 1. Сносим старый кривой кэш, если он остался
          rm -rf /home/runner/.buildozer/android/platform/android-sdk
          
          # 2. Создаем чистую структуру папок локального SDK
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          
          # 3. Скачиваем официальные cmdline-tools от Google (официальная стабильная версия)
          wget https://google.com -O cmdline.zip
          unzip -q cmdline.zip -d /tmp/cmdline
          
          # 4. Переносим содержимое в структуру папок Buildozer
          cp -r /tmp/cmdline/cmdline-tools/* /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          
          # 5. Делаем обратную совместимость для старого Buildozer (создаем ссылку на tools/bin)
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools
          ln -sf /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          
          # 6. Накатываем хэши лицензий. Теперь у нас на них полные права, никакого Operation not permitted!
          LICENSE_HASHES="
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          893a4cd1c3e7463197415a91248ee225231d5bc0
          d56f5187479451eabf01fb74bf653453a3bc5610
          84831b9409646a918e30573bab4c9c91346d8abd
          4594c0d84d151c0747a4447c283439114e327203
          ed39065b3a4e2862f15c7756ec04ee7a0cb33d1b
          "
          echo "$LICENSE_HASHES" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # 7. Выставляем права на исполнение для скачанных бинарников
          chmod +x /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/*

      - name: Build APK with Buildozer
        run: |
          # Указываем Бульдозеру работать строго с нашей изолированной локальной папкой SDK
          export ANDROID_SDK_ROOT="/home/runner/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
          
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osanka-apk
          path: bin/*.apk
