name: Build Osanka APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17 (Обязательно для Android API 34)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libsqlite3-dev libffi-dev uuid-dev imagemagick aidl

      - name: Install pip, setuptools and buildozer
        run: |
          python -m pip install --upgrade pip setuptools virtualenv
          python -m pip install "cython<3.0.0" buildozer

      - name: Check and auto-create icon if missing
        run: |
          if [ ! -f "icon.png" ]; then
            echo "⚠️ Иконка icon.png не найдена! Создаем временную коралловую заглушку..."
            convert -size 512x512 xc:#F28073 icon.png
          fi

      - name: Deploy Isolated Clean Android SDK
        run: |
          # 1. Полностью зачищаем все старые косячные пути
          rm -rf /home/runner/.buildozer/android/platform/android-sdk
          
          # 2. Создаем правильную структуру папок для cmdline-tools
          # Важно: распаковывать нужно в структуру cmdline-tools/tools, чтобы p4a не ослеп!
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          
          # 3. Качаем официальный архив инструментов сборки напрямую с серверов Google
          # Флаг -L обязателен, чтобы curl не качал 220 байт редиректа!
          curl -L https://google.com -o commandlinetools.zip
          
          # 4. Распаковываем инструменты
          unzip -q commandlinetools.zip -d /tmp/cmdline
          
          # 5. Переносим папки так, как этого требует старый парсер p4a (каталог tools внутри cmdline-tools)
          mv /tmp/cmdline/cmdline-tools /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/tools
          
          # 6. Дублируем sdkmanager в старый путь tools/bin для самого Бульдозера
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/tools/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          
          # 7. Заливаем пак хэшей лицензий
          SDK_HASHES="
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          893a4cd1c3e7463197415a91248ee225231d5bc0
          d56f5187479451eabf01fb74bf653453a3bc5610
          84831b9409646a918e30573bab4c9c91346d8abd
          4594c0d84d151c0747a4447c283439114e327203
          ed39065b3a4e2862f15c7756ec04ee7a0cb33d1b
          "
          echo "$SDK_HASHES" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          mkdir -p ~/.android/licenses
          echo "$SDK_HASHES" > ~/.android/licenses/android-sdk-license
          
          # 8. Даем полные права на исполнение
          chmod -R +x /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/tools/bin/

      - name: Build APK with Buildozer
        run: |
          # Выставляем Java 17
          export JAVA_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"
          
          # Замыкаем переменные окружения на наш идеальный изолированный SDK
          export ANDROID_SDK_ROOT="/home/runner/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
          
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osanka-apk
          path: bin/*.apk
