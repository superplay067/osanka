name: Build Osanka APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libsqlite3-dev libffi-dev uuid-dev imagemagick

      - name: Install pip, setuptools and buildozer
        run: |
          pip install --upgrade pip setuptools virtualenv
          pip install "cython<3.0.0" buildozer

      - name: Check and auto-create icon if missing
        run: |
          if [ ! -f "icon.png" ]; then
            echo "⚠️ Иконка icon.png не найдена! Создаем временную коралловую заглушку..."
            convert -size 512x512 xc:#F28073 icon.png
          fi

      - name: Force Fix Android Environment and SDK Paths
        run: |
          # 1. Сносим старые ссылки, если они криво легли
          rm -rf /home/runner/.buildozer/android/platform/android-sdk
          
          # 2. Создаем структуру папок, которую жестко ищет старый Buildozer
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          
          # 3. Прибиваем конкретно sdkmanager гвоздями к новому пути в системном SDK гитхаба
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          
          # 4. Накатываем хэши лицензий в обе папки (и в системную, и в локальную кэша)
          mkdir -p /usr/local/lib/android/sdk/licenses
          LICENSE_HASHES="
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          893a4cd1c3e7463197415a91248ee225231d5bc0
          d56f5187479451eabf01fb74bf653453a3bc5610
          84831b9409646a918e30573bab4c9c91346d8abd
          4594c0d84d151c0747a4447c283439114e327203
          ed39065b3a4e2862f15c7756ec04ee7a0cb33d1b
          "
          echo "$LICENSE_HASHES" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "$LICENSE_HASHES" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build APK with Buildozer
        run: |
          # Прокидываем системный путь к SDK в переменные окружения самого Бульдозера
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osanka-apk
          path: bin/*.apk
