name: Build Osanka APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libsqlite3-dev libffi-dev uuid-dev imagemagick

      - name: Install pip, setuptools and buildozer
        run: |
          pip install --upgrade pip setuptools virtualenv
          pip install "cython<3.0.0" buildozer

      - name: Check and auto-create icon if missing
        run: |
          if [ ! -f "icon.png" ]; then
            echo "⚠️ Иконка icon.png не найдена! Создаем временную коралловую заглушку..."
            convert -size 512x512 xc:#F28073 icon.png
          fi

      - name: Pre-accept Android SDK Licenses Globally
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Подписываем вообще все лицензии Google через системный SDK-менеджер
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Buildozer
        run: |
          # Запускаем сборку. Все лицензии уже приняты шагом выше!
          buildozer android debug
