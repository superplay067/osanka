name: Build Osanka APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libsqlite3-dev libffi-dev uuid-dev imagemagick

      - name: Install pip, setuptools and buildozer
        run: |
          pip install --upgrade pip setuptools virtualenv
          pip install "cython<3.0.0" buildozer

      - name: Check and auto-create icon if missing
        run: |
          if [ ! -f "icon.png" ]; then
            echo "⚠️ Иконка icon.png не найдена! Создаем временную коралловую заглушку..."
            convert -size 512x512 xc:#F28073 icon.png
          fi

      - name: Force Accept Android Licenses into Buildozer Cache
        run: |
          # Создаем структуру папок лицензий прямо в будущем кэше Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          
          # Записываем официальные хэши согласия Google (для SDK, Preview и NDK)
          echo -e "\n893a4cd1c3e7463197415a91248ee225231d5bc0\nd56f5187479451eabf01fb74bf653453a3bc5610\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n893a4cd1c3e7463197415a91248ee225231d5bc0\nd56f5187479451eabf01fb74bf653453a3bc5610\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK with Buildozer
        run: |
          # Собираем в чистом режиме. Лицензии подкинуты вручную шагом выше!
          buildozer android debug

