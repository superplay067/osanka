name: Pure Clean Build Osanka APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_fresh_apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout fresh repository
        uses: actions/checkout@v4

      - name: Initialize clean Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize clean JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install fresh system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libsqlite3-dev libffi-dev uuid-dev imagemagick

      - name: Force install stable packages from PyPI
        run: |
          python -m pip install --no-cache-dir --upgrade pip setuptools virtualenv
          python -m pip install --no-cache-dir "cython<3.0.0" buildozer

      - name: Generate coral app icon
        run: |
          if [ ! -f "icon.png" ]; then
            convert -size 512x512 xc:#F28073 icon.png
          fi

      - name: Inject Android SDK licenses manually
        run: |
          mkdir -p ~/.android/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          SDK_HASHES="
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          893a4cd1c3e7463197415a91248ee225231d5bc0
          d56f5187479451eabf01fb74bf653453a3bc5610
          84831b9409646a918e30573bab4c9c91346d8abd
          4594c0d84d151c0747a4447c283439114e327203
          ed39065b3a4e2862f15c7756ec04ee7a0cb33d1b
          "
          PREVIEW_HASH="84831b9409646a918e30573bab4c9c91346d8abd"
          
          echo "$SDK_HASHES" > ~/.android/licenses/android-sdk-license
          echo "$SDK_HASHES" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "$PREVIEW_HASH" > ~/.android/licenses/android-sdk-preview-license
          echo "$PREVIEW_HASH" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Compile Android APK via Buildozer
        run: |
          export JAVA_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"
          
          unset ANDROID_SDK_ROOT
          unset ANDROID_HOME
          
          buildozer android debug

      - name: Save Osanka APK binary
        uses: actions/upload-artifact@v4
        with:
          name: osanka-release-apk
          path: bin/*.apk
